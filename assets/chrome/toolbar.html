<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Amni Chrome</title>
<style>
:root{--bg-darkest:#0D0F12;--bg:#08090B;--bg-focus:#111418;--bg-elev:#111418;--bg-hover:#161A20;--bg-active:#161A20;--stroke:#20242B;--text:#EDEFF2;--text-dim:#A7ADB6;--accent:#C89B4E;--accent-dim:#E2BC7C;--danger:#FF6B6B;--success:#4ADE80;--accent-warn:#E8B04B;--glow:rgba(200,155,78,.18);--tab-active:#08090B;--tab-inactive:transparent;--font:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--radius:4px;--tab-radius:calc(var(--radius) + 4px) calc(var(--radius) + 4px) 0 0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font:13px/1.2 var(--font);color:var(--text);background:transparent;user-select:none;-webkit-user-select:none;pointer-events:none}
#shell{height:84px;display:flex;flex-direction:column;background:var(--bg);pointer-events:auto;border-bottom:1px solid var(--stroke);position:relative}
#find{display:none;position:absolute;left:0;right:0;top:40px;height:42px;align-items:center;gap:6px;padding:0 10px;background:var(--bg);border-top:1px solid var(--stroke);z-index:5}
#find.on{display:flex}
#find input{flex:1;min-width:0;height:28px;border:1px solid var(--stroke);border-radius:14px;background:var(--bg-elev);color:var(--text);padding:0 12px;font:13px var(--font);outline:none}
#find input:focus{border-color:var(--accent)}
#suggest,#panel{display:none;position:absolute;left:8px;right:8px;top:84px;max-height:240px;overflow:auto;background:var(--bg-elev);border:1px solid var(--stroke);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:auto;z-index:6}
#suggest.on,#panel.on{display:block}
#suggest button,#panel button.row{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--text);padding:8px 12px;font:12px var(--font);cursor:pointer}
#suggest button:hover,#panel button.row:hover{background:var(--bg-hover)}
#suggest .sub,#panel .sub{color:var(--text-dim);font-size:11px;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#panel h3{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);padding:8px 12px 4px}
#tabs{display:flex;align-items:flex-end;height:40px;padding:4px 8px 0;gap:3px;background:var(--bg-darkest)}
#tab-list{display:flex;align-items:flex-end;gap:2px;flex:0 1 auto;min-width:0;max-width:calc(100% - 40px);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--stroke) transparent}
.tab{display:flex;align-items:center;gap:7px;min-width:120px;max-width:240px;height:32px;padding:0 10px;border:1px solid transparent;border-bottom:none;border-radius:var(--tab-radius);background:var(--tab-inactive);color:var(--text-dim);cursor:pointer;position:relative;font-size:12px;transition:background .12s,color .12s,border-color .12s}
.tab:hover{background:var(--bg-elev);color:var(--text)}
.tab.active{background:var(--tab-active);color:var(--text);border-color:var(--stroke);box-shadow:0 2px 0 var(--accent) inset,0 -1px 4px rgba(0,0,0,.2);z-index:2}
.tab .favicon{width:15px;height:15px;flex:0 0 15px;border-radius:4px;background:var(--accent-dim);display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff}
.tab .title{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tab .close{opacity:0;pointer-events:none;width:28px;height:28px;line-height:26px;text-align:center;border-radius:50%;font-size:14px;color:var(--text-dim);cursor:pointer;flex:0 0 28px;transition:opacity .12s,background .12s}
.tab:hover .close,.tab.active .close,.tab:focus-visible .close{opacity:1;pointer-events:auto}
.tab .close:hover{background:var(--danger);color:#fff}
.tab .engine-badge{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--accent);display:none}
.tab.media .engine-badge{display:block;background:var(--accent-warn)}
.tab:focus-visible,.tab.kbd-focus{outline:2px solid var(--accent);outline-offset:-2px;z-index:3}
#new-tab{width:32px;height:32px;border-radius:var(--radius);background:transparent;color:var(--text-dim);border:none;cursor:pointer;font-size:18px;line-height:30px;text-align:center;margin:0 0 2px 4px;transition:background .12s,color .12s;flex:0 0 32px}
#new-tab:hover{background:var(--bg-elev);color:var(--text)}
#new-tab:focus,#new-tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px;background:var(--bg-elev);color:var(--text)}
#nav{display:flex;align-items:center;justify-content:flex-start;height:42px;padding:0 8px;gap:4px;background:var(--bg)}
.nav-btn{width:36px;height:36px;border-radius:var(--radius);background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 36px;transition:background .12s,color .12s}
.nav-btn:hover{background:var(--bg-elev);color:var(--text)}
.nav-btn:active{background:var(--bg-active)}
.nav-btn:focus,.nav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;background:var(--bg-elev);color:var(--text)}
.nav-btn.disabled{opacity:.35;pointer-events:none}
#nav-start{display:flex;align-items:center;gap:2px;flex:0 0 auto}
#url-wrap{flex:1 1 auto;min-width:160px;max-width:960px;display:flex;align-items:center;height:32px;margin:0 6px;padding:0 12px;background:var(--bg-elev);border:1px solid var(--stroke);border-radius:16px;transition:border-color .12s,background .12s,box-shadow .12s}
#url-wrap:hover{background:var(--bg-hover)}
#url-wrap.focused,#url-wrap:focus-within{border-color:var(--accent);background:var(--bg-focus);box-shadow:0 0 0 3px var(--glow)}
#lock{color:var(--text-dim);font-size:11px;margin-right:6px;flex:0 0 auto;line-height:1;transition:color .12s}
#lock.secure{color:var(--success)}
#lock.insecure{color:var(--accent-warn)}
#lock.local{color:var(--text-dim)}
#url{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;font-family:var(--font);letter-spacing:.1px}
#url:focus,#url:focus-visible{outline:none}
#url::placeholder{color:var(--text-dim)}
#url-actions{display:flex;gap:2px;flex:0 0 auto;margin-right:-4px}
#url-actions .nav-btn{width:28px;height:28px;flex:0 0 28px;font-size:13px;border-radius:var(--radius)}
#bookmark.on{color:var(--accent-warn);filter:drop-shadow(0 0 5px rgba(232,176,75,.55))}
#bookmark[aria-pressed="true"]{color:var(--accent-warn)}
#shield{color:var(--accent)}
#shield.off{color:var(--text-dim);opacity:.55}
#shield[aria-pressed="false"]{color:var(--text-dim);opacity:.55}
#nav-end{display:flex;align-items:center;gap:2px;flex:0 0 auto}
#zoom-level{min-width:40px;height:36px;line-height:36px;text-align:center;font-size:11px;color:var(--text-dim);cursor:pointer;padding:0 6px;border-radius:var(--radius);transition:color .12s,background .12s}
#zoom-level.off{color:var(--accent)}
#zoom-level:hover{color:var(--text);background:var(--bg-elev)}
#zoom-level:focus,#zoom-level:focus-visible{outline:2px solid var(--accent);outline-offset:1px;color:var(--text);background:var(--bg-elev)}
/* ── PROGRESS ──────────────────────────────── */
#progress{height:2px;background:transparent;position:relative;overflow:hidden;flex:0 0 2px}
#progress-bar{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));transition:width .18s ease-out,opacity .28s;opacity:0}
#progress.loading #progress-bar,#progress.finishing #progress-bar{opacity:1}
.tab.loading .favicon{box-shadow:0 0 0 1px var(--accent-dim);animation:pulse .9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
/* ── ICONS (text glyphs — swap for SVG later) */
.ico{font-family:"Segoe UI Symbol",-apple-system,sans-serif;font-weight:400}
</style>
</head>
<body>
<div id="shell">
  <div id="tabs">
    <div id="tab-list" role="tablist"><div class="tab active" data-id="t0" tabindex="0" role="tab" aria-selected="true"><span class="favicon">A</span><span class="title">Amni Browse</span><span class="close ico" title="Close tab" aria-label="Close tab">&#215;</span><span class="engine-badge"></span></div></div>
    <button id="new-tab" class="ico" title="New tab (Ctrl+T)">+</button>
  </div>
  <div id="nav">
    <div id="nav-start">
      <button class="nav-btn ico" id="back" title="Back (Alt+&#8592;)">&#8592;</button>
      <button class="nav-btn ico" id="forward" title="Forward (Alt+&#8594;)">&#8594;</button>
      <button class="nav-btn ico" id="reload" title="Reload (Ctrl+R)">&#8635;</button>
    </div>
    <div id="url-wrap">
      <span id="lock" class="ico">&#9673;</span>
      <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter URL&#8230;" value="">
      <div id="url-actions">
        <button class="nav-btn ico" id="logins" title="Passwords" aria-pressed="false" style="display:none">&#128273;</button>
        <button class="nav-btn ico" id="bookmark" title="Bookmark (Ctrl+D)">&#9734;</button>
      </div>
    </div>
    <div id="nav-end">
      <button class="nav-btn ico" id="zoom-out" title="Zoom out (Ctrl+-)">&#8722;</button>
      <span id="zoom-level" title="Reset zoom (Ctrl+0)" tabindex="0" role="button">100%</span>
      <button class="nav-btn ico" id="zoom-in" title="Zoom in (Ctrl+=)">&#43;</button>
      <button class="nav-btn ico" id="upd" title="Update available" style="display:none">&#8593;</button>
      <button class="nav-btn ico" id="shield" title="Shield: blocking ads &amp; trackers">&#9960;</button>
      <button class="nav-btn ico" id="find-btn" title="Find (Ctrl+F)">&#9906;</button>
      <button class="nav-btn ico" id="menu" title="Menu" aria-haspopup="true">&#9776;</button>
    </div>
  </div>
  <div id="progress"><div id="progress-bar"></div></div>
  <div id="find"><input id="find-q" type="text" placeholder="Find in page" spellcheck="false"><button class="nav-btn ico" id="find-prev" title="Previous">&#8593;</button><button class="nav-btn ico" id="find-next" title="Next">&#8595;</button><button class="nav-btn ico" id="find-x" title="Close">&#215;</button></div>
</div>
<div id="suggest" role="listbox"></div>
<div id="panel"></div>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const url=$('#url'),wrap=$('#url-wrap'),bar=$('#progress-bar'),prog=$('#progress'),tabList=$('#tab-list'),back=$('#back'),forward=$('#forward'),zoomLevel=$('#zoom-level'),lock=$('#lock'),shieldBtn=$('#shield'),bmBtn=$('#bookmark');
  function cmd(name,args){const q=args?'?'+new URLSearchParams(args).toString():'';fetch('amnibrowse://cmd/'+name+q,{mode:'no-cors'}).catch(()=>{});}
  let finishTimer=null;
  function setProgress(loading){if(finishTimer){clearTimeout(finishTimer);finishTimer=null}if(loading){prog.classList.remove('finishing');prog.classList.add('loading');bar.style.width='72%';return}if(!prog.classList.contains('loading')&&!prog.classList.contains('finishing')){bar.style.width='0%';return}prog.classList.remove('loading');prog.classList.add('finishing');bar.style.width='100%';finishTimer=setTimeout(()=>{prog.classList.remove('finishing');bar.style.width='0%';finishTimer=null},220)}
  function setLock(v){const s=String(v||'').toLowerCase();const local=!s||s.startsWith('about:')||s.startsWith('amnibrowse:')||s.startsWith('file:')||s.startsWith('data:');const secure=s.startsWith('https://');lock.className='ico'+(local?' local':secure?' secure':' insecure');lock.textContent=local?'●':secure?'🔒':'⚠';lock.title=local?'Local page':secure?'Connection is secure':'Not secure'}
  let lastUrl='';
  function setUrl(v){setLock(v);lastUrl=v||'';const hide=/^(data:|about:blank$|amnibrowse:\/\/newtab)/i.test(v||'');const show=hide?'':(v||'');if(document.activeElement!==url&&url.value!==show)url.value=show}
  function setNavDisabled(b,f){back.classList.toggle('disabled',!b);forward.classList.toggle('disabled',!f);}
  function setShield(on){shieldBtn.classList.toggle('off',!on);shieldBtn.setAttribute('aria-pressed',on?'true':'false');shieldBtn.title=on?'Shield: blocking ads & trackers':'Shield OFF — click to re-enable'}
  function setBookmarked(on){bmBtn.classList.toggle('on',!!on);bmBtn.setAttribute('aria-pressed',on?'true':'false');bmBtn.innerHTML=on?'&#9733;':'&#9734;';bmBtn.title=on?'Bookmarked — click to remove (Ctrl+D)':'Bookmark (Ctrl+D)'}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function mono(t){const s=String(t||'').replace(/^https?:\/\/(www\.)?/,'');const ch=(s.match(/[a-z0-9]/i)||['•'])[0].toUpperCase();let h=0;for(let i=0;i<s.length&&i<24;i++)h=(h*31+s.charCodeAt(i))>>>0;return{ch:ch,hue:h%360}}
  function tabs(){return[...tabList.querySelectorAll('.tab')]}
  function setRoving(el,focus){if(!el)return;tabs().forEach(t=>t.setAttribute('tabindex',t===el?'0':'-1'));if(focus!==false)el.focus();try{el.scrollIntoView({inline:'nearest',block:'nearest'})}catch(e){}}
  function findTab(id){return tabs().find(t=>t.dataset.id===id)||null}
  let lastActiveId=null;
  function renderTabs(list){const html=(list||[]).map(t=>{const m=mono(t.title&&t.title!=='New Tab'?t.title:t.url);return`<div class="tab ${t.active?'active':''} ${t.engine==='media'?'media':''} ${t.loading?'loading':''}" data-id="${esc(t.id)}" tabindex="${t.active?0:-1}" role="tab" aria-selected="${t.active?'true':'false'}" title="${esc(t.title||'New Tab')}"><span class="favicon" style="background:hsl(${m.hue},45%,38%)">${esc(m.ch)}</span><span class="title">${esc(t.title||'New Tab')}</span><span class="close ico" title="Close tab" aria-label="Close tab">&#215;</span><span class="engine-badge"></span></div>`}).join('');const activeId=((list||[]).find(t=>t.active)||{}).id||null;const activeChanged=activeId!==lastActiveId;lastActiveId=activeId;if(tabList.innerHTML===html){if(activeChanged){const a=tabList.querySelector('.tab.active');if(a)try{a.scrollIntoView({inline:'nearest',block:'nearest'})}catch(e){}}return}const ae=document.activeElement;const onTab=tabList.contains(ae)&&ae.classList.contains('tab');const keep=onTab?ae.dataset.id:null;const sl=tabList.scrollLeft;tabList.innerHTML=html;tabList.scrollLeft=sl;if(keep){const r=findTab(keep)||tabList.querySelector('.tab[tabindex="0"]')||tabList.querySelector('.tab');if(r)setRoving(r,true)}else{const a=tabList.querySelector('.tab.active')||tabList.querySelector('.tab');if(a){setRoving(a,false);if(activeChanged)try{a.scrollIntoView({inline:'nearest',block:'nearest'})}catch(e){}}}}
  function setZoom(z){const pct=Math.round((z||1)*100);if(zoomLevel.textContent!==pct+'%')zoomLevel.textContent=pct+'%';zoomLevel.classList.toggle('off',pct!==100)}
  function applyTheme(th){if(!th||typeof th!=='object')return;const r=document.documentElement.style;const m={'--bg-darkest':th.bg_secondary,'--bg':th.bg_primary,'--bg-primary':th.bg_primary,'--bg-focus':th.bg_tertiary,'--bg-elev':th.bg_tertiary,'--bg-tertiary':th.bg_tertiary,'--bg-hover':th.bg_hover,'--bg-active':th.bg_hover,'--stroke':th.border,'--border':th.border,'--text':th.text_primary,'--text-primary':th.text_primary,'--text-dim':th.text_secondary,'--text-secondary':th.text_secondary,'--text-muted':th.text_secondary,'--accent':th.accent,'--accent-dim':th.accent_hover,'--danger':th.danger,'--success':th.success,'--accent-warn':th.warning,'--glow':th.accent_glow,'--tab-active':th.tab_active,'--tab-inactive':th.tab_inactive,'--chrome':th.bg_secondary,'--font':th.font_family,'--radius':th.border_radius};Object.entries(m).forEach(([k,v])=>{if(v)r.setProperty(k,v)})}
  const loginBtn=$('#logins'),updBtn=$('#upd');
  function applyState(s){setUrl(s.url||'');setProgress(!!s.loading);setNavDisabled(!!s.canBack,!!s.canForward);renderTabs(s.tabs||[]);setZoom(s.zoom);setShield(s.shield!==false);setBookmarked(!!s.bookmarked);applyTheme(s.theme);const logs=s.logins||[];if(loginBtn){loginBtn.style.display=logs.length?'inline-flex':'none';loginBtn.title=(s.pm||'Passwords')+' · '+logs.length+' on this page';loginBtn.dataset.n=String(logs.length)}if(updBtn){updBtn.style.display=s.update?'inline-flex':'none';if(s.update)updBtn.title='Update '+s.update.version+' from '+s.update.source}}
  async function poll(){try{const r=await fetch('amnibrowse://state',{cache:'no-store'});if(!r.ok)return;applyState(await r.json())}catch(e){}}
  url.addEventListener('focus',()=>{wrap.classList.add('focused');url.select()});
  url.addEventListener('blur',()=>wrap.classList.remove('focused'));
  const suggest=$('#suggest'),panel=$('#panel'),findBar=$('#find'),findQ=$('#find-q');
  function overlay(h){cmd('overlay',{h:String(h||0)})}
  function hideFly(){suggest.classList.remove('on');panel.classList.remove('on');overlay(0)}
  let sugTimer=null;
  async function showSuggest(q){try{const r=await fetch('amnibrowse://suggest?q='+encodeURIComponent(q||''),{cache:'no-store'});const list=await r.json();if(!Array.isArray(list)||!list.length){suggest.classList.remove('on');overlay(findBar.classList.contains('on')?0:0);return}suggest.innerHTML=list.map(it=>'<button type="button" data-url="'+esc(it.url)+'"><span>'+esc(it.title||it.url)+'</span><span class="sub">'+esc(it.url)+'</span></button>').join('');suggest.classList.add('on');panel.classList.remove('on');overlay(Math.min(240,list.length*44+8))}catch(e){suggest.classList.remove('on')}}
  url.addEventListener('input',()=>{clearTimeout(sugTimer);const v=url.value.trim();sugTimer=setTimeout(()=>{v?showSuggest(v):hideFly()},80)});
  url.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=url.value.trim();if(v)cmd('navigate',{url:v});url.blur();hideFly()}if(e.key==='Escape'){url.value=lastUrl;url.blur();hideFly()}});
  suggest.addEventListener('mousedown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();cmd('navigate',{url:b.dataset.url});hideFly();url.blur()});
  function showFind(){findBar.classList.add('on');findQ.focus();findQ.select()}
  function hideFind(){findBar.classList.remove('on');cmd('find',{q:'',dir:'1'})}
  $('#find-btn').addEventListener('click',()=>findBar.classList.contains('on')?hideFind():showFind());
  findQ.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();cmd('find',{q:findQ.value,dir:e.shiftKey?'-1':'1'})}if(e.key==='Escape')hideFind()});
  $('#find-next').addEventListener('click',()=>cmd('find',{q:findQ.value,dir:'1'}));
  $('#find-prev').addEventListener('click',()=>cmd('find',{q:findQ.value,dir:'-1'}));
  $('#find-x').addEventListener('click',hideFind);
  async function showPanel(kind){hideFly();try{const path=kind==='dl'?'downloads':'history';const r=await fetch('amnibrowse://'+path,{cache:'no-store'});const list=await r.json();const title=kind==='dl'?'Downloads':'History';const rows=(list||[]).slice(0,20).map(it=>{const u=it.url||'';const t=it.title||it.filename||u;return '<button type="button" class="row" data-url="'+esc(u)+'"><span>'+esc(t)+'</span><span class="sub">'+esc(u||it.status||'')+'</span></button>'}).join('')||'<p class="sub" style="padding:10px 12px">Nothing here yet.</p>';panel.innerHTML='<h3>'+title+'</h3>'+rows;panel.classList.add('on');overlay(Math.min(240,48+(list||[]).length*40))}catch(e){}}
  panel.addEventListener('mousedown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();if(b.dataset.fill){cmd('fill_login',{id:b.dataset.fill});hideFly();return}if(b.dataset.url){cmd('navigate',{url:b.dataset.url});hideFly()}});
  function showLogins(list){hideFly();const rows=(list||[]).map(it=>'<button type="button" class="row" data-fill="'+esc(it.id)+'"><span>'+esc(it.username||it.id)+'</span><span class="sub">'+esc((it.source||'')+' · '+(it.site||''))+'</span></button>').join('')||'<p class="sub" style="padding:10px 12px">Unlock your password manager in Settings.</p>';panel.innerHTML='<h3>Fill login</h3>'+rows;panel.classList.add('on');overlay(Math.min(240,48+(list||[]).length*40))}
  loginBtn&&loginBtn.addEventListener('click',async()=>{try{const r=await fetch('amnibrowse://state',{cache:'no-store'});const s=await r.json();showLogins(s.logins||[])}catch(e){}});
  updBtn&&updBtn.addEventListener('click',()=>cmd('menu'));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideFly();hideFind()}});
  const buttons={'back':'back','forward':'forward','reload':'reload','bookmark':'bookmark','shield':'shield','menu':'menu','new-tab':'new_tab','zoom-in':'zoom_in','zoom-out':'zoom_out'};
  Object.entries(buttons).forEach(([id,c])=>{const el=$('#'+id);el&&el.addEventListener('click',()=>cmd(c))});
  zoomLevel.addEventListener('click',()=>cmd('zoom_reset'));
  zoomLevel.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cmd('zoom_reset')}});
  tabList.addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;if(e.target.classList.contains('close')){cmd('close_tab',{id:t.dataset.id});e.stopPropagation()}else{setRoving(t);cmd('switch_tab',{id:t.dataset.id})}});
  tabList.addEventListener('keydown',e=>{const t=e.target.closest('.tab');if(!t)return;const all=tabs(),i=all.indexOf(t);if(e.key==='Enter'||e.key===' '){e.preventDefault();cmd('switch_tab',{id:t.dataset.id});return}if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();cmd('close_tab',{id:t.dataset.id});return}let n=null;if(e.key==='ArrowRight')n=all[(i+1)%all.length];if(e.key==='ArrowLeft')n=all[(i+all.length-1)%all.length];if(e.key==='Home')n=all[0];if(e.key==='End')n=all[all.length-1];if(n){e.preventDefault();setRoving(n);cmd('switch_tab',{id:n.dataset.id})}});
  $('#tabs').addEventListener('auxclick',e=>{if(e.button!==1)return;e.preventDefault();const t=e.target.closest('.tab');t?cmd('close_tab',{id:t.dataset.id}):e.target.closest('#new-tab')||cmd('new_tab')});
  tabList.addEventListener('wheel',e=>{if(!e.deltaY||e.deltaX)return;e.preventDefault();tabList.scrollLeft+=e.deltaY},{passive:false});
  $('#tabs').addEventListener('dblclick',e=>{if(!e.target.closest('.tab')&&!e.target.closest('#new-tab'))cmd('new_tab')});
  window.__amni={setProgress,setUrl,setLock,showFind,showPanel,chromeRev:'__CHROMEREV__'};
  setLock(url.value);poll();setInterval(poll,250);
})();
