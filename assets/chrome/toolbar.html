<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Amni Chrome</title>
<style>
:root{--bg-darkest:#06090f;--bg:#0a0e1a;--bg-focus:#10172b;--bg-elev:#141a2a;--bg-hover:#1a2132;--bg-active:#1e2538;--stroke:#222a3d;--text:#d6dbe8;--text-dim:#8a92a6;--accent:#00d4ff;--accent-dim:#0089a8;--danger:#ff5577;--success:#3ccf8e;--accent-warn:#ff9a3c;--radius:10px;--tab-radius:8px 8px 0 0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font:13px/1.2 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:transparent;user-select:none;-webkit-user-select:none;pointer-events:none}
#shell{height:66px;display:flex;flex-direction:column;background:var(--bg);pointer-events:auto}
/* ── TAB STRIP ─────────────────────────────── */
#tabs{display:flex;align-items:flex-end;height:32px;padding:3px 6px 0;gap:2px;background:var(--bg-darkest)}
#tab-list{display:flex;align-items:flex-end;gap:2px;flex:0 1 auto;min-width:0;max-width:calc(100% - 32px);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#tab-list::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;min-width:96px;max-width:210px;height:28px;padding:0 9px;border-radius:var(--tab-radius);background:transparent;color:var(--text-dim);cursor:pointer;position:relative;font-size:12px;transition:background .12s,color .12s}
.tab:hover{background:var(--bg-elev);color:var(--text)}
.tab.active{background:var(--bg);color:var(--text);box-shadow:0 2px 0 var(--accent) inset}
.tab .favicon{width:15px;height:15px;flex:0 0 15px;border-radius:4px;background:var(--accent-dim);display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff}
.tab .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .close{opacity:0;pointer-events:none;width:20px;height:20px;line-height:18px;text-align:center;border-radius:50%;font-size:13px;color:var(--text-dim);cursor:pointer;flex:0 0 20px;transition:opacity .12s,background .12s}
.tab:hover .close,.tab.active .close,.tab:focus .close,.tab:focus-visible .close{opacity:1;pointer-events:auto}
.tab .close:hover{background:var(--danger);color:#fff}
.tab .engine-badge{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--accent);display:none}
.tab.media .engine-badge{display:block;background:var(--accent-warn)}
.tab:focus,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
#new-tab{width:26px;height:26px;border-radius:8px;background:transparent;color:var(--text-dim);border:none;cursor:pointer;font-size:16px;line-height:24px;text-align:center;margin:0 0 2px 3px;transition:background .12s,color .12s;flex:0 0 26px}
#new-tab:hover{background:var(--bg-elev);color:var(--text)}
#new-tab:focus,#new-tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px;background:var(--bg-elev);color:var(--text)}
/* ── NAV BAR ───────────────────────────────── */
#nav{display:flex;align-items:center;justify-content:flex-start;height:32px;padding:0 6px;gap:2px;background:var(--bg);border-bottom:1px solid var(--stroke)}
.nav-btn{width:28px;height:28px;border-radius:7px;background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 28px;transition:background .12s,color .12s}
.nav-btn:hover{background:var(--bg-elev);color:var(--text)}
.nav-btn:active{background:var(--bg-active)}
.nav-btn:focus,.nav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;background:var(--bg-elev);color:var(--text)}
.nav-btn.disabled{opacity:.35;pointer-events:none}
#nav-start{display:flex;align-items:center;gap:2px;flex:0 0 auto}
#url-wrap{flex:0 1 960px;min-width:140px;max-width:960px;display:flex;align-items:center;height:26px;margin:0 5px;padding:0 9px;background:var(--bg-elev);border:1px solid var(--stroke);border-radius:13px;transition:border-color .12s,background .12s,box-shadow .12s}
#url-wrap:hover{background:var(--bg-hover)}
#url-wrap.focused,#url-wrap:focus-within{border-color:var(--accent);background:var(--bg-focus);box-shadow:0 0 0 2px var(--accent-dim)}
#lock{color:var(--text-dim);font-size:11px;margin-right:6px;flex:0 0 auto;line-height:1;transition:color .12s}
#lock.secure{color:var(--success)}
#lock.insecure{color:var(--accent-warn)}
#lock.local{color:var(--text-dim)}
#url{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);font:12.5px inherit;letter-spacing:.1px}
#url:focus,#url:focus-visible{outline:none}
#url::placeholder{color:var(--text-dim)}
#url-actions{display:flex;gap:2px;flex:0 0 auto;margin-right:-5px}
#url-actions .nav-btn{width:26px;height:22px;flex:0 0 26px;font-size:12px;border-radius:5px}
#bookmark.on{color:var(--accent-warn)}
#shield{color:var(--accent)}
#shield.off{color:var(--text-dim);opacity:.55}
#nav-end{display:flex;align-items:center;gap:2px;flex:0 0 auto}
#zoom-level{min-width:38px;height:28px;line-height:28px;text-align:center;font-size:11px;color:var(--text-dim);cursor:pointer;padding:0 5px;border-radius:7px;transition:color .12s,background .12s}
#zoom-level.off{color:var(--accent)}
#zoom-level:hover{color:var(--text);background:var(--bg-elev)}
#zoom-level:focus,#zoom-level:focus-visible{outline:2px solid var(--accent);outline-offset:1px;color:var(--text);background:var(--bg-elev)}
/* ── PROGRESS ──────────────────────────────── */
#progress{height:2px;background:transparent;position:relative;overflow:hidden;flex:0 0 2px}
#progress-bar{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));transition:width .18s ease-out,opacity .28s;opacity:0}
#progress.loading #progress-bar,#progress.finishing #progress-bar{opacity:1}
.tab.loading .favicon{box-shadow:0 0 0 1px var(--accent-dim);animation:pulse .9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
/* ── ICONS (text glyphs — swap for SVG later) */
.ico{font-family:"Segoe UI Symbol",-apple-system,sans-serif;font-weight:400}
</style>
</head>
<body>
<div id="shell">
  <div id="tabs">
    <div id="tab-list" role="tablist"><div class="tab active" data-id="t0" tabindex="0" role="tab" aria-selected="true"><span class="favicon">A</span><span class="title">Amni Browse</span><span class="close ico" role="presentation">&#215;</span><span class="engine-badge"></span></div></div>
    <button id="new-tab" class="ico" title="New tab (Ctrl+T)">+</button>
  </div>
  <div id="nav">
    <div id="nav-start">
      <button class="nav-btn ico" id="back" title="Back (Alt+&#8592;)">&#8592;</button>
      <button class="nav-btn ico" id="forward" title="Forward (Alt+&#8594;)">&#8594;</button>
      <button class="nav-btn ico" id="reload" title="Reload (Ctrl+R)">&#8635;</button>
    </div>
    <div id="url-wrap">
      <span id="lock" class="ico">&#9673;</span>
      <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter URL&#8230;" value="https://duckduckgo.com/">
      <div id="url-actions">
        <button class="nav-btn ico" id="bookmark" title="Bookmark (Ctrl+D)">&#9734;</button>
      </div>
    </div>
    <div id="nav-end">
      <button class="nav-btn ico" id="zoom-out" title="Zoom out (Ctrl+-)">&#8722;</button>
      <span id="zoom-level" title="Reset zoom (Ctrl+0)" tabindex="0" role="button">100%</span>
      <button class="nav-btn ico" id="zoom-in" title="Zoom in (Ctrl+=)">&#43;</button>
      <button class="nav-btn ico" id="shield" title="Shield: blocking ads &amp; trackers">&#9960;</button>
      <button class="nav-btn ico" id="menu" title="Settings">&#9776;</button>
    </div>
  </div>
  <div id="progress"><div id="progress-bar"></div></div>
</div>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const url=$('#url'),wrap=$('#url-wrap'),bar=$('#progress-bar'),prog=$('#progress'),tabList=$('#tab-list'),back=$('#back'),forward=$('#forward'),zoomLevel=$('#zoom-level'),lock=$('#lock'),shieldBtn=$('#shield'),bmBtn=$('#bookmark');
  function cmd(name,args){const q=args?'?'+new URLSearchParams(args).toString():'';fetch('amnibrowse://cmd/'+name+q,{mode:'no-cors'}).catch(()=>{});}
  let finishTimer=null;
  function setProgress(loading){if(finishTimer){clearTimeout(finishTimer);finishTimer=null}if(loading){prog.classList.remove('finishing');prog.classList.add('loading');bar.style.width='72%';return}if(!prog.classList.contains('loading')&&!prog.classList.contains('finishing')){bar.style.width='0%';return}prog.classList.remove('loading');prog.classList.add('finishing');bar.style.width='100%';finishTimer=setTimeout(()=>{prog.classList.remove('finishing');bar.style.width='0%';finishTimer=null},220)}
  function setLock(v){const s=String(v||'').toLowerCase();const local=!s||s.startsWith('about:')||s.startsWith('amnibrowse:')||s.startsWith('file:')||s.startsWith('data:');const secure=s.startsWith('https://');lock.className='ico'+(local?' local':secure?' secure':' insecure');lock.textContent=local?'●':secure?'🔒':'⚠';lock.title=local?'Local page':secure?'Connection is secure':'Not secure'}
  function setUrl(v){setLock(v);if(document.activeElement!==url&&url.value!==v)url.value=v}
  function setNavDisabled(b,f){back.classList.toggle('disabled',!b);forward.classList.toggle('disabled',!f);}
  function setShield(on){shieldBtn.classList.toggle('off',!on);shieldBtn.title=on?'Shield: blocking ads & trackers':'Shield OFF — click to re-enable'}
  function setBookmarked(on){bmBtn.classList.toggle('on',!!on);bmBtn.innerHTML=on?'&#9733;':'&#9734;';bmBtn.title=on?'Bookmarked — click to remove (Ctrl+D)':'Bookmark (Ctrl+D)'}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function mono(t){const s=String(t||'').replace(/^https?:\/\/(www\.)?/,'');const ch=(s.match(/[a-z0-9]/i)||['•'])[0].toUpperCase();let h=0;for(let i=0;i<s.length&&i<24;i++)h=(h*31+s.charCodeAt(i))>>>0;return{ch:ch,hue:h%360}}
  function tabs(){return[...tabList.querySelectorAll('.tab')]}
  function setRoving(el,focus){if(!el)return;tabs().forEach(t=>t.setAttribute('tabindex',t===el?'0':'-1'));if(focus!==false)el.focus();try{el.scrollIntoView({inline:'nearest',block:'nearest'})}catch(e){}}
  function findTab(id){return tabs().find(t=>t.dataset.id===id)||null}
  function renderTabs(list){const html=(list||[]).map(t=>{const m=mono(t.title&&t.title!=='New Tab'?t.title:t.url);return`<div class="tab ${t.active?'active':''} ${t.engine==='media'?'media':''} ${t.loading?'loading':''}" data-id="${esc(t.id)}" tabindex="${t.active?0:-1}" role="tab" aria-selected="${t.active?'true':'false'}" title="${esc(t.title||'New Tab')}"><span class="favicon" style="background:hsl(${m.hue},45%,38%)">${esc(m.ch)}</span><span class="title">${esc(t.title||'New Tab')}</span><span class="close ico" role="presentation">&#215;</span><span class="engine-badge"></span></div>`}).join('');if(tabList.innerHTML===html){const a=tabList.querySelector('.tab.active');if(a)try{a.scrollIntoView({inline:'nearest',block:'nearest'})}catch(e){}return}const ae=document.activeElement;const onTab=tabList.contains(ae)&&ae.classList.contains('tab');const keep=onTab?ae.dataset.id:null;tabList.innerHTML=html;if(keep){const r=findTab(keep)||tabList.querySelector('.tab[tabindex="0"]')||tabList.querySelector('.tab');if(r)setRoving(r,true)}else{const a=tabList.querySelector('.tab.active')||tabList.querySelector('.tab');if(a){setRoving(a,false);try{a.scrollIntoView({inline:'nearest',block:'nearest'})}catch(e){}}}}
  function setZoom(z){const pct=Math.round((z||1)*100);if(zoomLevel.textContent!==pct+'%')zoomLevel.textContent=pct+'%';zoomLevel.classList.toggle('off',pct!==100)}
  function applyTheme(th){if(!th||typeof th!=='object')return;const r=document.documentElement.style;const m={'--bg-darkest':th.bg_secondary,'--bg':th.bg_primary,'--bg-focus':th.bg_tertiary,'--bg-elev':th.bg_tertiary,'--bg-hover':th.bg_hover,'--bg-active':th.bg_hover,'--stroke':th.border,'--text':th.text_primary,'--text-dim':th.text_secondary,'--accent':th.accent,'--accent-dim':th.accent_hover,'--danger':th.danger,'--success':th.success,'--accent-warn':th.warning,'--radius':th.border_radius};Object.entries(m).forEach(([k,v])=>{if(v)r.setProperty(k,v)})}
  function applyState(s){setUrl(s.url||'');setProgress(!!s.loading);setNavDisabled(!!s.canBack,!!s.canForward);renderTabs(s.tabs||[]);setZoom(s.zoom);setShield(s.shield!==false);setBookmarked(!!s.bookmarked);applyTheme(s.theme)}
  async function poll(){try{const r=await fetch('amnibrowse://state',{cache:'no-store'});if(!r.ok)return;applyState(await r.json())}catch(e){}}
  url.addEventListener('focus',()=>{wrap.classList.add('focused');url.select()});
  url.addEventListener('blur',()=>wrap.classList.remove('focused'));
  url.addEventListener('keydown',e=>{if(e.key==='Enter'){cmd('navigate',{url:url.value});url.blur()}if(e.key==='Escape')url.blur()});
  const buttons={'back':'back','forward':'forward','reload':'reload','bookmark':'bookmark','shield':'shield','menu':'menu','new-tab':'new_tab','zoom-in':'zoom_in','zoom-out':'zoom_out'};
  Object.entries(buttons).forEach(([id,c])=>{const el=$('#'+id);el&&el.addEventListener('click',()=>cmd(c))});
  zoomLevel.addEventListener('click',()=>cmd('zoom_reset'));
  zoomLevel.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cmd('zoom_reset')}});
  tabList.addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;if(e.target.classList.contains('close')){cmd('close_tab',{id:t.dataset.id});e.stopPropagation()}else{setRoving(t);cmd('switch_tab',{id:t.dataset.id})}});
  tabList.addEventListener('keydown',e=>{const t=e.target.closest('.tab');if(!t)return;const all=tabs(),i=all.indexOf(t);if(e.key==='Enter'||e.key===' '){e.preventDefault();cmd('switch_tab',{id:t.dataset.id});return}if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();cmd('close_tab',{id:t.dataset.id});return}let n=null;if(e.key==='ArrowRight')n=all[(i+1)%all.length];if(e.key==='ArrowLeft')n=all[(i+all.length-1)%all.length];if(e.key==='Home')n=all[0];if(e.key==='End')n=all[all.length-1];if(n){e.preventDefault();setRoving(n);cmd('switch_tab',{id:n.dataset.id})}});
  tabList.addEventListener('auxclick',e=>{if(e.button!==1)return;const t=e.target.closest('.tab');if(t){cmd('close_tab',{id:t.dataset.id});e.preventDefault()}});
  window.__amni={setProgress,setUrl,setLock,chromeRev:'0.11.0-settings'};
  setLock(url.value);poll();setInterval(poll,250);
})();
</script>
</body>
</html>
