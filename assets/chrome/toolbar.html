<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Amni Chrome</title>
<style>
@font-face{font-family:Archivo;font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url("__FONT_MAIN__") format("woff2")}
@font-face{font-family:Archivo;font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url("__FONT_EXT__") format("woff2");unicode-range:U+0100-02BA}
:root{--bg-darkest:#0D0F12;--bg:#08090B;--bg-focus:#111418;--bg-elev:#111418;--bg-hover:#161A20;--bg-active:#161A20;--stroke:#20242B;--text:#EDEFF2;--text-dim:#A7ADB6;--accent:#C89B4E;--accent-dim:#E2BC7C;--danger:#FF6B6B;--success:#4ADE80;--accent-warn:#E8B04B;--glow:transparent;--tab-active:#08090B;--tab-inactive:#12151A;--font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--radius:6px;--tab-radius:8px 8px 0 0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font:13px/1.3 var(--font);color:var(--text);background:transparent;user-select:none;-webkit-user-select:none;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-start}
#shell{height:var(--shell-h,119px);flex:0 0 var(--shell-h,119px);margin-bottom:auto;display:flex;flex-direction:column;background:var(--bg);pointer-events:auto;position:relative;box-shadow:inset 0 -1px 0 var(--stroke)}
#find{display:none;position:absolute;left:0;right:0;top:40px;height:76px;align-items:center;gap:6px;padding:0 10px;background:var(--bg);border-top:1px solid var(--stroke);z-index:5}
#find.on{display:flex}
#find input{flex:1;min-width:0;height:28px;border:1px solid var(--stroke);border-radius:3px;background:var(--bg-elev);color:var(--text);padding:0 10px;font:12.5px var(--font);outline:none}
#find input:focus{border-color:var(--accent)}
#ctx-scrim{display:none;position:absolute;inset:0;pointer-events:auto;z-index:8;background:transparent}
#ctx-scrim.on{display:block}
#fly-scrim{display:none;position:absolute;inset:0;pointer-events:auto;z-index:5;background:transparent}
#fly-scrim.on{display:block}
#ctxmenu{position:absolute;min-width:196px;max-width:280px;padding:4px 0;background:var(--bg-elev);border:1px solid var(--stroke);border-radius:3px;pointer-events:auto;z-index:9}
#ctxmenu button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--text);padding:7px 14px;font:12px var(--font);cursor:pointer}
#ctxmenu button:hover{background:var(--bg-hover)}
#ctxmenu button:disabled{opacity:.38;pointer-events:none}
#ctxmenu .sep{height:1px;background:var(--stroke);margin:4px 8px}
#ctxmenu .grp{padding:6px 14px 2px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);font-weight:650}
#dlg-scrim{display:none;position:absolute;inset:0;pointer-events:auto;z-index:10;background:rgba(8,9,11,.72);align-items:center;justify-content:center}
#dlg-scrim.on{display:flex}
#col-scrim{display:none;position:fixed;inset:0;pointer-events:auto;z-index:9;background:transparent}
#col-scrim.on{display:block}
#colorpop{position:absolute;width:236px;padding:10px;background:var(--bg-elev);border:1px solid var(--stroke);border-radius:3px;pointer-events:auto;z-index:10}
#col-sv{position:relative;height:120px;border:1px solid var(--stroke);cursor:crosshair;background-image:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,transparent)}
#col-hue{position:relative;height:12px;margin-top:8px;border:1px solid var(--stroke);cursor:ew-resize;background:linear-gradient(to right,#f00 0%,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00 100%)}
#col-sv .knob{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border:1.5px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.6);pointer-events:none}
#col-hue .knob{position:absolute;top:-2px;width:4px;height:14px;margin-left:-2px;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6);pointer-events:none}
#col-swatches{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:8px}
#col-swatches button{height:16px;border:1px solid var(--stroke);border-radius:2px;cursor:pointer;padding:0}
#col-swatches button:hover{border-color:var(--accent)}
#col-row{display:flex;align-items:center;gap:6px;margin-top:8px}
#col-prev{width:26px;height:26px;flex:0 0 26px;border:1px solid var(--stroke);border-radius:2px}
#col-hex{flex:1;min-width:0;height:26px;border:1px solid var(--stroke);border-radius:2px;background:var(--bg);color:var(--text);padding:0 8px;font:11.5px Consolas,monospace;text-transform:uppercase;outline:none}
#col-hex:focus{border-color:var(--accent)}
#col-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
#col-actions button{height:26px;padding:0 12px;border:1px solid var(--stroke);border-radius:2px;background:var(--bg);color:var(--text);font:11.5px var(--font);cursor:pointer}
#col-actions button.primary{background:var(--accent);border-color:var(--accent);color:#0D0F12;font-weight:650}
#col-actions button:hover{border-color:var(--accent)}
#dlg-box{min-width:280px;max-width:420px;padding:16px 18px;background:var(--bg-elev);border:1px solid var(--stroke);border-radius:3px;box-shadow:0 8px 32px rgba(0,0,0,.45)}
#dlg-msg{margin:0 0 12px;font:12.5px/1.45 var(--font);color:var(--text);white-space:pre-wrap;word-break:break-word}
#dlg-input{display:none;width:100%;height:30px;margin:0 0 12px;border:1px solid var(--stroke);border-radius:3px;background:var(--bg-focus);color:var(--text);padding:0 10px;font:12.5px var(--font);outline:none}
#dlg-input.on{display:block}
#dlg-input:focus{border-color:var(--accent)}
#dlg-actions{display:flex;justify-content:flex-end;gap:8px}
#dlg-actions button{min-width:72px;height:30px;border:1px solid var(--stroke);border-radius:3px;background:var(--bg-hover);color:var(--text);font:12px var(--font);cursor:pointer}
#dlg-actions button.primary{background:var(--accent);border-color:var(--accent);color:#111}
#dlg-actions button:hover{filter:brightness(1.08)}
#suggest,#panel{display:none;position:absolute;left:8px;right:8px;bottom:auto;top:var(--shell-h,119px);max-height:320px;overflow:auto;background:var(--bg-elev);border:1px solid var(--stroke);border-radius:3px;box-shadow:none;pointer-events:auto;z-index:6}
#suggest.on,#panel.on{display:block}
#suggest button,#panel button.row{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--text);padding:8px 12px;font:12px var(--font);cursor:pointer}
#suggest button:hover,#panel button.row:hover,#suggest button.sel{background:var(--bg-hover)}
#suggest button{display:flex;align-items:center;gap:10px}
#suggest button .k{flex:0 0 18px;width:18px;text-align:center;color:var(--text-dim);font-size:12px}
#suggest button.ai .k,#suggest button.ai .t{color:var(--accent)}
#suggest button .t{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#suggest button .t .sub{display:inline;margin-left:8px}
#suggest button .act{flex:0 0 auto;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);border:1px solid var(--stroke);border-radius:10px;padding:2px 8px}
#panel .pbar{height:3px;background:var(--stroke);border-radius:2px;margin-top:6px;overflow:hidden}
#panel .pbar i{display:block;height:100%;background:var(--accent);width:0}
#panel .pbar.indet i{width:35%;animation:loadPulse 1.1s linear infinite}
#panel button.row{display:flex;align-items:center;gap:8px}
#panel button.row>.body{flex:1;min-width:0}
#panel button.row .x{flex:0 0 auto;color:var(--text-dim);font:600 13px/1 Consolas,monospace;padding:2px 6px;border-radius:4px}
#panel button.row .x:hover{background:var(--danger);color:#fff}
#panel .si{padding:6px 12px 10px}
#panel .si .host{font-size:13px;font-weight:600;margin-bottom:2px}
#panel .si .conn{font-size:11.5px;margin-bottom:10px}
#panel .si .conn.ok{color:var(--success)}
#panel .si .conn.bad{color:var(--danger)}
#panel .si .pr{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-top:1px solid var(--stroke);font-size:12px}
#panel .si select{background:var(--bg);color:var(--text);border:1px solid var(--stroke);border-radius:3px;font:11.5px var(--font);padding:3px 6px}
#panel .si .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
#panel .si .acts button{font:650 10.5px var(--font);letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:3px;border:1px solid var(--stroke);background:var(--bg);color:var(--text);cursor:pointer}
#panel .si .acts button:hover{border-color:var(--accent)}
#scope-chip{display:none;flex:0 0 auto;margin-right:7px;padding:2px 8px;border-radius:9px;background:var(--accent);color:#08090B;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
#scope-chip.on{display:inline-block}
#ai-btn{color:var(--accent);font-size:15px}
#ai-btn:hover{background:var(--bg-hover)}
#dl-btn{position:relative}
#dl-btn .badge{position:absolute;right:3px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--accent);display:none}
#dl-btn.active .badge{display:block;animation:dlPulse 1.2s ease-in-out infinite}
@keyframes dlPulse{0%,100%{opacity:1}50%{opacity:.35}}
#find-count{flex:0 0 auto;min-width:46px;text-align:center;font-size:11px;color:var(--text-dim);letter-spacing:.04em}
#find-count.none{color:var(--danger)}
#bmbar{display:none;align-items:center;gap:2px;height:28px;padding:0 8px;overflow:hidden;background:var(--tab-active);border-top:1px solid var(--stroke)}
#bmbar.on{display:flex}
#bmbar .bm{display:inline-flex;align-items:center;gap:6px;max-width:170px;height:22px;padding:0 8px;border-radius:5px;border:1px solid transparent;background:transparent;color:var(--text-dim);font:12px var(--font);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bmbar .bm:hover{background:var(--bg-hover);color:var(--text);border-color:var(--stroke)}
#bmbar .bm .fv{width:14px;height:14px;flex:0 0 14px;border-radius:3px;background:var(--bg-elev);font-size:8px;font-weight:700;color:var(--accent);display:inline-flex;align-items:center;justify-content:center}
#bmbar .empty{font-size:11.5px;color:var(--text-dim);padding:0 6px}
.tab .snd{flex:0 0 18px;width:18px;height:18px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;padding:0;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;pointer-events:auto;position:relative;z-index:6}
.tab .snd:hover{background:var(--bg-hover);color:var(--text)}
.tab .snd svg{width:12px;height:12px;display:block}
.tab.discarded .title{opacity:.55;font-style:italic}
.tab.discarded .favicon{opacity:.5}
#suggest .sub,#panel .sub{color:var(--text-dim);font-size:10.5px;letter-spacing:.08em;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#panel h3{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:650;color:var(--text-dim);padding:10px 12px 4px}
#tabs{display:flex;align-items:flex-end;height:40px;padding:6px 8px 0;gap:2px;background:var(--bg-darkest);position:relative;z-index:2;box-shadow:inset 0 -1px 0 var(--stroke)}
#tab-list{display:flex;align-items:flex-end;gap:2px;flex:0 1 auto;min-width:0;max-width:calc(100% - 240px);overflow-x:auto;overflow-y:hidden;scrollbar-width:none!important;-ms-overflow-style:none!important}
#tab-list::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
.tab{display:flex;align-items:center;gap:6px;flex:0 1 220px;min-width:140px;max-width:240px;height:28px;margin-bottom:1px;padding:0 4px 0 10px;border:1px solid transparent;border-bottom:none;border-radius:var(--tab-radius);background:var(--tab-inactive);color:var(--text-dim);cursor:pointer;position:relative;font-size:12px;letter-spacing:.01em;transition:background .12s,color .12s,height .12s,margin .12s,border-color .12s;user-select:none}
.tab:hover{background:var(--bg-hover);color:var(--text)}
.tab.active{height:35px;margin-bottom:0;background:var(--tab-active);color:var(--text);z-index:3;border-color:var(--stroke);border-bottom-color:var(--tab-active);box-shadow:0 1px 0 var(--tab-active)}
.tab .favicon{width:16px;height:16px;flex:0 0 16px;border-radius:3px;background:var(--bg-elev);border:none;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;letter-spacing:0;color:var(--accent);overflow:hidden}
.tab.active .favicon{background:var(--bg-hover);color:var(--accent)}
.tab .favicon.ico{background:transparent;padding:0}
.tab.pinned{min-width:34px;max-width:34px;padding:0 9px;flex:0 0 34px}
.tab.pinned .title,.tab.pinned .close{display:none}
.tab.grouped{border-top:2px solid var(--gc,var(--accent))}
.grp{display:inline-flex;align-items:center;gap:6px;height:22px;margin:0 2px 4px 6px;padding:0 9px;border-radius:11px;background:var(--gc,var(--accent));color:#111;font-size:11px;font-weight:700;cursor:pointer;align-self:flex-end;white-space:nowrap}
.grp .n{opacity:.7;font-weight:500}
#tabmenu{position:absolute;z-index:40;pointer-events:auto;display:none;min-width:190px;padding:6px;border-radius:8px;background:var(--bg-elev);border:1px solid var(--stroke);box-shadow:0 8px 24px rgba(0,0,0,.45)}
#tabmenu.on{display:block}
#tabmenu button{display:block;width:100%;text-align:left;padding:7px 10px;border:0;border-radius:6px;background:transparent;color:var(--text);font:inherit;cursor:pointer}
#tabmenu button:hover{background:var(--bg-hover)}
.tab .favicon img{width:16px;height:16px;display:block;object-fit:contain}
.tab .title{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500;font-size:12px;line-height:1.2}
.tab.active .title{font-weight:600}
.tab .close{opacity:0;width:20px;height:20px;line-height:1;text-align:center;border:none;background:transparent;padding:0;border-radius:4px;font:600 13px/1 Consolas,monospace;color:var(--text-dim);cursor:pointer;flex:0 0 20px;margin-left:2px;transition:opacity .12s,background .12s,color .12s;z-index:6;position:relative;display:inline-flex;align-items:center;justify-content:center;pointer-events:auto}
.tab:hover .close,.tab.active .close,.tab:focus-visible .close{opacity:1}
.tab .close:hover{background:var(--danger);color:#fff}
.tab .engine-badge{position:absolute;left:4px;bottom:3px;width:4px;height:4px;border-radius:1px;background:var(--accent);display:none;z-index:1}
.tab.media .engine-badge{display:block;background:var(--accent-warn)}
.tab:focus-visible,.tab.kbd-focus{outline:1px solid var(--accent);outline-offset:-2px;z-index:3}
.tab.shift{transition:transform .12s ease}
.tab.dragging{z-index:6;opacity:.92;background:var(--bg-elev);cursor:grabbing;transition:none}
#tab-list.dragging .tab{transition:transform .12s ease}
#tab-list.dragging{scroll-behavior:auto}
#new-tab{width:28px;height:28px;border-radius:6px;background:transparent;color:var(--text-dim);border:1px solid transparent;cursor:pointer;margin:0 0 3px 4px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 28px;font:600 16px/1 Consolas,monospace;pointer-events:auto;position:relative;z-index:10}
#tile-view{width:28px;height:28px;border-radius:6px;background:transparent;color:var(--text-dim);border:1px solid transparent;cursor:pointer;margin:0 0 3px 2px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 28px;pointer-events:auto;position:relative;z-index:10;transition:background .12s,color .12s,border-color .12s}
#tile-view:hover{background:var(--bg-elev);color:var(--text);border-color:var(--stroke)}
#tile-view:focus,#tile-view:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
#tab-drag{flex:1 1 auto;min-width:24px;height:32px;align-self:stretch;-webkit-app-region:drag}
#win-btns{display:flex;align-self:stretch;margin-left:8px;flex:0 0 auto;pointer-events:auto;position:relative;z-index:10;-webkit-app-region:no-drag}.win-btn{width:29px;height:40px;border:none;background:transparent;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:0;position:relative}.win-btn::before{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:4px;background:var(--text);opacity:0;transition:opacity .18s ease,background .18s ease}.win-btn svg{opacity:.78;position:relative;width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:butt;shape-rendering:geometricPrecision}.win-btn:hover svg{opacity:1}.win-btn:hover::before{opacity:.08}.win-btn:active::before{opacity:.14}#win-close:hover{color:var(--danger-ink,#1F0707)}#win-close:hover::before{background:var(--danger,#FF6B6B);opacity:1}#win-max .g-restore,#win-max.maxed .g-max{display:none}#win-max.maxed .g-restore{display:inline}#win-btns{margin-right:5px}



#new-tab:hover{background:var(--bg-elev);color:var(--text);border-color:var(--stroke)}
#new-tab:focus,#new-tab:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
#tile-scrim{position:fixed;inset:0;background:rgba(8,9,11,.9);z-index:50;display:none;align-items:center;justify-content:center;padding:24px;pointer-events:auto}
#tile-scrim.on{display:flex}
#tile-dialog{background:var(--bg-darkest);border:1px solid var(--stroke);border-radius:10px;width:92%;max-width:960px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.6);overflow:hidden}
#tile-header{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--stroke);background:var(--bg)}
#tile-title-wrap h2{font-size:15px;font-weight:600;color:var(--text);margin:0}
#tile-count{font-size:11.5px;color:var(--text-dim)}
#tile-search{flex:1;max-width:340px;height:30px;padding:0 10px;border-radius:6px;background:var(--bg-elev);border:1px solid var(--stroke);color:var(--text);font:inherit;font-size:12px;outline:none}
#tile-search:focus{border-color:var(--accent)}
#tile-header-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
#tile-new{height:30px;padding:0 12px;border-radius:6px;background:var(--accent);color:#08090B;font-weight:600;border:none;cursor:pointer;font-size:11.5px;transition:opacity .12s}
#tile-new:hover{opacity:.9}
#tile-close{width:30px;height:30px;border-radius:6px;background:transparent;border:1px solid transparent;color:var(--text-dim);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#tile-close:hover{background:var(--bg-hover);color:var(--text);border-color:var(--stroke)}
#tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:16px 18px;overflow-y:auto;max-height:calc(85vh - 65px)}
.tab-tile{background:var(--bg-elev);border:1px solid var(--stroke);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;position:relative;transition:border-color .12s,transform .12s,box-shadow .12s}
.tab-tile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.tab-tile.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 4px 12px rgba(200,155,78,.2)}
.tab-tile-top{display:flex;align-items:center;gap:8px}
.tab-tile-favicon{width:18px;height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:var(--bg-hover);font-size:9px;font-weight:700;color:var(--accent)}
.tab-tile-favicon img{width:16px;height:16px;object-fit:contain}
.tab-tile-title{font-size:12.5px;font-weight:600;color:var(--text);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tab-tile-close{width:20px;height:20px;border-radius:4px;background:transparent;border:none;color:var(--text-dim);font:600 13px/1 Consolas,monospace;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:auto}
.tab-tile-close:hover{background:var(--danger);color:#fff}
.tab-tile-url{font-size:11px;color:var(--text-dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nav-btn{width:34px;height:30px;border-radius:6px;background:transparent;border:1px solid transparent;color:var(--text-dim);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 34px;padding:0;font:600 15px/1 Consolas,monospace}
.nav-btn:hover{background:var(--bg-hover);color:var(--text)}
.nav-btn:active{background:var(--bg-active)}
.nav-btn:focus,.nav-btn:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
.nav-btn.disabled{opacity:.34;cursor:default}
.nav-btn.disabled:hover{background:transparent;color:var(--text-dim)}
#chrome-body{display:flex;flex-direction:column;flex:1 1 auto;background:var(--tab-active);position:relative;z-index:0}
#omni{display:flex;align-items:center;height:40px;padding:0 12px;gap:10px;background:var(--tab-active)}
#brand{display:flex;align-items:center;gap:7px;height:28px;padding:0 2px 0 0;flex:0 0 auto;color:var(--text);pointer-events:none}
#brand .mark{width:8px;height:8px;background:var(--accent);flex:0 0 8px;border-radius:1px}
#brand .word{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1;opacity:.92}
#nav{display:flex;align-items:center;justify-content:flex-start;height:36px;padding:0 10px 2px;gap:2px;background:var(--tab-active);border-top:1px solid var(--stroke)}
#nav-start{display:flex;align-items:center;gap:0;flex:0 0 auto}
#nav-gap{flex:1 1 auto;min-width:12px}
#url-wrap{flex:1 1 auto;min-width:160px;display:flex;align-items:center;height:30px;padding:0 8px 0 10px;background:var(--bg-elev);border:1px solid var(--stroke);border-radius:15px;transition:border-color .12s,background .12s,box-shadow .12s;cursor:text}
#url-wrap:hover{background:var(--bg-hover);border-color:var(--stroke)}
#url-wrap.focused,#url-wrap:focus-within{border-color:var(--accent);background:var(--bg-focus);box-shadow:0 0 0 1px rgba(200,155,78,.28)}
#page-ico{width:16px;height:16px;flex:0 0 16px;margin-right:6px;border-radius:3px;display:none;object-fit:contain;overflow:hidden}
#page-ico.on{display:block}
#lock{color:var(--text-dim);margin-right:7px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;cursor:pointer}
#lock:hover{background:var(--bg-hover)}
#lock svg{width:13px;height:13px;display:block}
#lock.secure{color:var(--accent)}
#lock.insecure{color:var(--danger)}
#lock.local{color:var(--text-dim)}
#lock.hide{display:none}
#url{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;font-family:var(--font);letter-spacing:0;caret-color:var(--accent)}
#url:focus,#url:focus-visible{outline:none}
#url::placeholder{color:var(--text-dim);letter-spacing:.04em;font-size:12px;font-weight:500;text-transform:none}
#url-actions{display:flex;gap:0;flex:0 0 auto}
#url-actions .nav-btn{width:26px;height:26px;flex:0 0 26px;border-radius:5px}
#bookmark.on{color:var(--accent)}
#bookmark[aria-pressed="true"]{color:var(--accent)}
#shield{color:var(--accent)}
#shield.off{color:var(--text-dim);opacity:.55}
#shield[aria-pressed="false"]{color:var(--text-dim);opacity:.55}
#nav-end{display:flex;align-items:center;gap:0;flex:0 0 auto}
#zoom-level{min-width:38px;height:30px;line-height:30px;text-align:center;font-size:10px;font-weight:650;letter-spacing:.06em;color:var(--text-dim);cursor:pointer;padding:0 4px;border-radius:6px}
#zoom-level.off{color:var(--accent)}
#zoom-level:hover{color:var(--text);background:var(--bg-hover)}
#zoom-level:focus,#zoom-level:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
#progress{height:3px;background:transparent;position:relative;overflow:hidden;flex:0 0 3px}
#progress.loading,#progress.finishing{background:rgba(200,155,78,.12)}
#progress-bar{position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--accent);transition:width .18s ease-out,opacity .28s;opacity:0}
#progress.loading #progress-bar,#progress.finishing #progress-bar{opacity:1}
#progress.loading::after{content:"";position:absolute;top:0;bottom:0;width:35%;background:linear-gradient(90deg,transparent,rgba(226,188,124,.85),transparent);animation:loadPulse 1.1s linear infinite}
@keyframes loadPulse{from{transform:translateX(-100%)}to{transform:translateX(320%)}}
#reload.spinning{animation:spinReload .9s linear infinite}
@keyframes spinReload{to{transform:rotate(360deg)}}
.tab.closing{opacity:.45;pointer-events:none}
.tab.loading .title{opacity:.72}
</style>
