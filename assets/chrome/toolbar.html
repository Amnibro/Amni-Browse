<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Amni Chrome</title>
<style>
:root{--bg-darkest:#06090f;--bg:#0a0e1a;--bg-focus:#10172b;--bg-elev:#141a2a;--bg-hover:#1a2132;--bg-active:#1e2538;--stroke:#222a3d;--text:#d6dbe8;--text-dim:#8a92a6;--accent:#00d4ff;--accent-dim:#0089a8;--danger:#ff5577;--success:#3ccf8e;--accent-warn:#ff9a3c;--radius:10px;--tab-radius:10px 10px 0 0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font:13px/1.2 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:transparent;user-select:none;-webkit-user-select:none;pointer-events:none}
#shell{height:74px;display:flex;flex-direction:column;background:var(--bg);pointer-events:auto}
/* ── TAB STRIP ─────────────────────────────── */
#tabs{display:flex;align-items:flex-end;height:36px;padding:4px 6px 0;gap:2px;background:linear-gradient(to bottom,var(--bg-darkest) 0%,var(--bg) 100%);border-bottom:1px solid var(--stroke)}
#tab-list{display:flex;align-items:flex-end;gap:2px;flex:0 1 auto;min-width:0;overflow:hidden}
.tab{display:flex;align-items:center;gap:6px;min-width:90px;max-width:220px;height:30px;padding:0 10px;border-radius:var(--tab-radius);background:var(--bg-elev);color:var(--text-dim);cursor:pointer;position:relative;font-size:12px;transition:background .12s,color .12s}
.tab:hover{background:var(--bg-hover);color:var(--text)}
.tab.active{background:var(--bg-active);color:var(--text);box-shadow:0 -2px 0 var(--accent) inset}
.tab .favicon{width:14px;height:14px;flex:0 0 14px;border-radius:3px;background:var(--accent-dim);display:inline-block}
.tab .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .close{opacity:0;pointer-events:none;width:22px;height:22px;line-height:20px;text-align:center;border-radius:50%;font-size:14px;color:var(--text-dim);cursor:pointer;flex:0 0 22px;transition:opacity .12s,background .12s}
.tab:hover .close,.tab.active .close,.tab:focus .close,.tab:focus-visible .close{opacity:1;pointer-events:auto}
.tab .close:hover{background:var(--danger);color:#fff}
.tab .engine-badge{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--accent);display:none}
.tab.media .engine-badge{display:block;background:var(--accent-warn)}
#new-tab{width:32px;height:32px;border-radius:50%;background:transparent;color:var(--text-dim);border:none;cursor:pointer;font-size:18px;line-height:30px;text-align:center;margin-left:2px;transition:background .12s,color .12s}
#new-tab:hover{background:var(--bg-elev);color:var(--text)}
#new-tab:focus,#new-tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px;background:var(--bg-elev);color:var(--text)}
/* ── NAV BAR ───────────────────────────────── */
#nav{display:flex;align-items:center;justify-content:flex-start;height:36px;padding:0 6px;gap:2px;background:var(--bg);border-bottom:1px solid var(--stroke)}
.nav-btn{width:32px;height:32px;border-radius:6px;background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 32px;transition:background .12s,color .12s}
.nav-btn:hover{background:var(--bg-elev);color:var(--text)}
.nav-btn:active{background:var(--bg-active)}
.nav-btn:focus,.nav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;background:var(--bg-elev);color:var(--text)}
.nav-btn.disabled{opacity:.35;pointer-events:none}
#nav-start{display:flex;align-items:center;gap:2px;flex:0 0 auto}
#url-wrap{flex:0 1 960px;min-width:140px;max-width:960px;display:flex;align-items:center;height:32px;margin:0 4px;padding:0 10px;background:var(--bg-elev);border:1px solid var(--stroke);border-radius:16px;transition:border-color .12s,background .12s,box-shadow .12s}
#url-wrap:hover{background:var(--bg-hover)}
#url-wrap.focused,#url-wrap:focus-within{border-color:var(--accent);background:var(--bg-focus);box-shadow:0 0 0 2px var(--accent-dim)}
#lock{color:var(--text-dim);font-size:12px;margin-right:6px;flex:0 0 auto;line-height:1;transition:color .12s}
#lock.secure{color:var(--success)}
#lock.insecure{color:var(--accent-warn)}
#lock.local{color:var(--text-dim)}
#url{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);font:13px inherit;letter-spacing:.1px}
#url:focus,#url:focus-visible{outline:none}
#url::placeholder{color:var(--text-dim)}
#url-actions{display:flex;gap:2px;flex:0 0 auto;margin-right:-4px}
#url-actions .nav-btn{width:26px;height:26px;flex:0 0 26px;font-size:13px;border-radius:5px}
#nav-end{display:flex;align-items:center;gap:2px;flex:0 0 auto}
#zoom-level{min-width:40px;height:32px;line-height:32px;text-align:center;font-size:11px;color:var(--text-dim);cursor:pointer;padding:0 6px;border-radius:6px;transition:color .12s,background .12s}
#zoom-level.off{color:var(--accent)}
#zoom-level:hover{color:var(--text);background:var(--bg-elev)}
#zoom-level:focus,#zoom-level:focus-visible{outline:2px solid var(--accent);outline-offset:1px;color:var(--text);background:var(--bg-elev)}
.tab:focus,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
/* ── PROGRESS ──────────────────────────────── */
#progress{height:2px;background:transparent;position:relative;overflow:hidden}
#progress-bar{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));transition:width .2s ease-out,opacity .3s}
#progress.loading #progress-bar{opacity:1}
#progress:not(.loading) #progress-bar{opacity:0}
/* ── ICONS (text glyphs — swap for SVG later) */
.ico{font-family:"Segoe UI Symbol",-apple-system,sans-serif;font-weight:400}
</style>
</head>
<body>
<div id="shell">
  <div id="tabs">
    <div id="tab-list" role="tablist"><div class="tab active" data-id="t0" tabindex="0" role="tab" aria-selected="true"><span class="favicon"></span><span class="title">Amni Browse</span><span class="close ico" role="presentation">&#215;</span><span class="engine-badge"></span></div></div>
    <button id="new-tab" class="ico" title="New tab">+</button>
  </div>
  <div id="nav">
    <div id="nav-start">
      <button class="nav-btn ico" id="back" title="Back">&#8592;</button>
      <button class="nav-btn ico" id="forward" title="Forward">&#8594;</button>
      <button class="nav-btn ico" id="reload" title="Reload">&#8635;</button>
    </div>
    <div id="url-wrap">
      <span id="lock" class="ico">&#9673;</span>
      <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter URL&#8230;" value="https://duckduckgo.com/">
      <div id="url-actions">
        <button class="nav-btn ico" id="bookmark" title="Bookmark (Ctrl+D)">&#9734;</button>
      </div>
    </div>
    <div id="nav-end">
      <button class="nav-btn ico" id="zoom-out" title="Zoom out (Ctrl+-)">&#8722;</button>
      <span id="zoom-level" title="Reset zoom (Ctrl+0)" tabindex="0" role="button">100%</span>
      <button class="nav-btn ico" id="zoom-in" title="Zoom in (Ctrl+=)">&#43;</button>
      <button class="nav-btn ico" id="shield" title="Privacy shield">&#9960;</button>
      <button class="nav-btn ico" id="menu" title="Menu">&#9776;</button>
    </div>
  </div>
  <div id="progress"><div id="progress-bar"></div></div>
</div>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const url=$('#url'),wrap=$('#url-wrap'),bar=$('#progress-bar'),prog=$('#progress'),tabList=$('#tab-list'),back=$('#back'),forward=$('#forward'),zoomLevel=$('#zoom-level'),lock=$('#lock');
  function cmd(name,args){const q=args?'?'+new URLSearchParams(args).toString():'';fetch('amnibrowse://cmd/'+name+q,{mode:'no-cors'}).catch(()=>{});}
  function setProgress(loading){loading?prog.classList.add('loading'):prog.classList.remove('loading');loading?bar.style.width='70%':bar.style.width='0%';}
  function setLock(v){const s=String(v||'').toLowerCase();const local=!s||s.startsWith('about:')||s.startsWith('amnibrowse:')||s.startsWith('file:');const secure=s.startsWith('https://');lock.className='ico'+(local?' local':secure?' secure':' insecure');lock.textContent=local?'\u25CF':secure?'\uD83D\uDD12':'\u26A0';lock.title=local?'Local page':secure?'Connection is secure':'Not secure'}
  function setUrl(v){setLock(v);if(document.activeElement!==url&&url.value!==v)url.value=v}
  function setNavDisabled(b,f){back.classList.toggle('disabled',!b);forward.classList.toggle('disabled',!f);}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function tabs(){return[...tabList.querySelectorAll('.tab')]}
  function setRoving(el,focus){if(!el)return;tabs().forEach(t=>t.setAttribute('tabindex',t===el?'0':'-1'));if(focus!==false)el.focus()}
  function findTab(id){return tabs().find(t=>t.dataset.id===id)||null}
  function renderTabs(list){const html=(list||[]).map(t=>`<div class="tab ${t.active?'active':''} ${t.engine==='media'?'media':''}" data-id="${esc(t.id)}" tabindex="${t.active?0:-1}" role="tab" aria-selected="${t.active?'true':'false'}"><span class="favicon"></span><span class="title">${esc(t.title||'New Tab')}</span><span class="close ico" role="presentation">&#215;</span><span class="engine-badge"></span></div>`).join('');if(tabList.innerHTML===html)return;const ae=document.activeElement;const onTab=tabList.contains(ae)&&ae.classList.contains('tab');const keep=onTab?ae.dataset.id:null;tabList.innerHTML=html;if(keep){const r=findTab(keep)||tabList.querySelector('.tab[tabindex="0"]')||tabList.querySelector('.tab');if(r)setRoving(r,true)}else{const a=tabList.querySelector('.tab.active')||tabList.querySelector('.tab');if(a)setRoving(a,false)}}
  function setZoom(z){const pct=Math.round((z||1)*100);if(zoomLevel.textContent!==pct+'%')zoomLevel.textContent=pct+'%';zoomLevel.classList.toggle('off',pct!==100)}
  function applyState(s){setUrl(s.url||'');setProgress(!!s.loading);setNavDisabled(!!s.canBack,!!s.canForward);renderTabs(s.tabs||[]);setZoom(s.zoom)}
  async function poll(){try{const r=await fetch('amnibrowse://state',{cache:'no-store'});if(!r.ok)return;applyState(await r.json())}catch(e){}}
  url.addEventListener('focus',()=>{wrap.classList.add('focused');url.select()});
  url.addEventListener('blur',()=>wrap.classList.remove('focused'));
  url.addEventListener('keydown',e=>{if(e.key==='Enter'){cmd('navigate',{url:url.value});url.blur()}if(e.key==='Escape')url.blur()});
  const buttons={'back':'back','forward':'forward','reload':'reload','bookmark':'bookmark','shield':'shield','menu':'menu','new-tab':'new_tab','zoom-in':'zoom_in','zoom-out':'zoom_out'};
  Object.entries(buttons).forEach(([id,c])=>{const el=$('#'+id);el&&el.addEventListener('click',()=>cmd(c))});
  zoomLevel.addEventListener('click',()=>cmd('zoom_reset'));
  zoomLevel.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cmd('zoom_reset')}});
  tabList.addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;if(e.target.classList.contains('close')){cmd('close_tab',{id:t.dataset.id});e.stopPropagation()}else{setRoving(t);cmd('switch_tab',{id:t.dataset.id})}});
  tabList.addEventListener('keydown',e=>{const t=e.target.closest('.tab');if(!t)return;const all=tabs(),i=all.indexOf(t);if(e.key==='Enter'||e.key===' '){e.preventDefault();cmd('switch_tab',{id:t.dataset.id});return}if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();cmd('close_tab',{id:t.dataset.id});return}let n=null;if(e.key==='ArrowRight')n=all[(i+1)%all.length];if(e.key==='ArrowLeft')n=all[(i+all.length-1)%all.length];if(e.key==='Home')n=all[0];if(e.key==='End')n=all[all.length-1];if(n){e.preventDefault();setRoving(n);cmd('switch_tab',{id:n.dataset.id})}});
  tabList.addEventListener('auxclick',e=>{if(e.button!==1)return;const t=e.target.closest('.tab');if(t){cmd('close_tab',{id:t.dataset.id});e.preventDefault()}});
  window.__amni={setProgress,setUrl,setLock,chromeRev:'0.10.9-tabstrip'};
  setLock(url.value);poll();setInterval(poll,250);
})();
</script>
</body>
</html>
